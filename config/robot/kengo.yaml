robot_xml_path: "asset/robot/kengo_description/mjcf/kengo.xml"
verbose: True
render_debug: False
keypoints_path: "output_data/keypoints/kengo/body_check_001__A548_M_from_g1_keypoints.pkl"

# Keep these offsets and the knee bend identical to the G1 configuration.
joints_limit_offset_degrees:
  knee_joint: [10.0, 0.0]
  elbow_joint: [20.0, 0.0]
knee_angle_offset_degrees: 15.0

# This semantic topology intentionally mirrors config/robot/g1.yaml. Kengo's
# final arm body is wrist_roll_link because it has no wrist pitch/yaw joints.
robot_links:
  left_hip: [hips_sphere, left_hip_roll_link]
  left_thigh: [left_hip_roll_link, left_knee_link]
  left_calf: [left_knee_link, left_ankle_roll_link]

  right_hip: [hips_sphere, right_hip_roll_link]
  right_thigh: [right_hip_roll_link, right_knee_link]
  right_calf: [right_knee_link, right_ankle_roll_link]

  neck: [hips_sphere, neck_sphere]
  head: [neck_sphere, head_sphere]

  left_shoulder: [neck_sphere, left_shoulder_roll_link]
  left_arm: [left_shoulder_roll_link, left_elbow_link]
  left_fore_arm: [left_elbow_link, left_wrist_roll_link]

  right_shoulder: [neck_sphere, right_shoulder_roll_link]
  right_arm: [right_shoulder_roll_link, right_elbow_link]
  right_fore_arm: [right_elbow_link, right_wrist_roll_link]

contact_links: [left_foot_end_link, left_toe_link,
                right_foot_end_link, right_toe_link,
                left_wrist_roll_link, right_wrist_roll_link]

contact_vel_calculate_window: 6
contact_vel_threshold: 0.5
contact_height_threshold: 0.05
contact_height_lpf_alpha: 0.15
contact_pos_fixed_factor: 15.0

ik_match_table: {
  "hips_mean": ["hips_sphere", 100, 0],

  "left_hip": ["left_hip_roll_link", 30, 3],
  "left_thigh": ["left_knee_link", 0.0, 3.0],
  "left_calf": ["left_ankle_roll_link", 30, 3],

  "right_hip": ["right_hip_roll_link", 30, 3],
  "right_thigh": ["right_knee_link", 0.0, 3.0],
  "right_calf": ["right_ankle_roll_link", 30, 3],

  "head": ["head_sphere", 0, 3.0],

  "left_shoulder": ["left_shoulder_roll_link", 30, 3],
  "left_arm": ["left_elbow_link", 10.0, 1],
  "left_fore_arm": ["left_wrist_roll_link", 10, 1],

  "right_shoulder": ["right_shoulder_roll_link", 30, 3],
  "right_arm": ["right_elbow_link", 10.0, 1],
  "right_fore_arm": ["right_wrist_roll_link", 10, 1]
}

key_frame_config:
  hips_mean:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  left_up_leg:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  left_leg:
    # Kengo knee bodies have a fixed -10 degree Y installation rotation
    # relative to the G1 body frame used by this key-frame convention.
    offset_deg_xyz: [0.0, -10.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  left_foot:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  right_up_leg:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  right_leg:
    offset_deg_xyz: [0.0, -10.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  right_foot:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  shoulder_mean:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  left_arm:
    # Preserve the Kengo shoulder-roll zero frame (fixed +/-10 degree X
    # installation rotations) through the same mechanism G1 uses.
    offset_deg_xyz: [10.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [0.0, 1.0, 0.0]
      z: [-1.0, 0.0, 0.0]
  left_fore_arm:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [1.0, 0.0, 0.0]
      y: [0.0, 1.0, 0.0]
      z: [0.0, 0.0, 1.0]
  left_hand:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [1.0, 0.0, 0.0]
      y: [0.0, 1.0, 0.0]
      z: [0.0, 0.0, 1.0]
  right_arm:
    offset_deg_xyz: [-10.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [0.0, -1.0, 0.0]
      z: [1.0, 0.0, 0.0]
  right_fore_arm:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [-1.0, 0.0, 0.0]
      y: [0.0, -1.0, 0.0]
      z: [0.0, 0.0, 1.0]
  right_hand:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [-1.0, 0.0, 0.0]
      y: [0.0, -1.0, 0.0]
      z: [0.0, 0.0, 1.0]
  head:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
